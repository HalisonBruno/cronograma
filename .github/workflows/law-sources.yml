name: Official law sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Download public official legislation only
        run: python scripts/fetch-law-mirrors.py --out official-law-cache --workers 4 --direct-first
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-law-cache
          path: official-law-cache/
          retention-days: 3
