<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Cronograma ENAM 2026.2 — Halison</title>
<style>
:root{
  --bg:#FAF7F4; --surface:#FFFFFF; --surface2:#F3EDE8; --ink:#26201E; --muted:#7A6E6A;
  --line:#E6DCD5; --accent:#7A2F3F; --accent-ink:#FFFFFF; --accent-soft:#F5E6EA;
  --done:#2E7D4F; --done-soft:#E4F1E9; --warn:#B87514; --warn-soft:#F7ECDC; --danger:#B3383B;
  --lei:#7A2F3F; --ebook:#1F5C7A; --aula:#8A5A10; --quest:#2E6B4F; --juris:#5B4A7A;
  --rev:#8A7E79; --sim:#B3383B; --ceb:#0F6B5C; --tq:#8A5A10; --setup:#8A7E79;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1B1618; --surface:#251E21; --surface2:#2E2528; --ink:#EDE6E3; --muted:#A99B96;
  --line:#3A3034; --accent:#D68B9B; --accent-ink:#2A1218; --accent-soft:#3A272C;
  --done:#66BB8A; --done-soft:#22352B; --warn:#D9A24C; --warn-soft:#3A3122; --danger:#E07B7E;
  --lei:#D68B9B; --ebook:#6FAECB; --aula:#D0A254; --quest:#74B896; --juris:#A390C9;
  --rev:#A99B96; --sim:#E07B7E; --ceb:#5BB3A4; --tq:#D0A254; --setup:#A99B96;
}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;margin:0;padding:0 0 80px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 0}
h1{font-family:Georgia,"Times New Roman",serif;font-size:1.25rem;margin:0;letter-spacing:.2px;text-wrap:balance}
.sub{color:var(--muted);font-size:.8rem;margin:2px 0 8px}
.statrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:stretch}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-variant-numeric:tabular-nums}
.stat b{font-family:Georgia,serif;font-size:1.15rem;color:var(--accent);display:block;line-height:1.1}
.stat span{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#syncpill{align-self:center;margin-left:auto;font-size:.7rem;border-radius:99px;padding:4px 11px;border:1px solid var(--line);color:var(--muted);background:var(--surface);cursor:pointer}
#syncpill.ok{color:var(--done);border-color:var(--done)}
#syncpill.err,#syncpill.badtoken{color:var(--danger);border-color:var(--danger)}
#syncpill.sync{color:var(--warn);border-color:var(--warn)}
nav.tabs{display:flex;gap:2px;margin:0 -14px;padding:0 14px;overflow-x:auto}
nav.tabs button{flex:1;min-width:78px;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);padding:9px 4px;font:600 .85rem "Segoe UI",system-ui,sans-serif;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.daynav{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
.daynav button{background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--ink);width:38px;height:34px;font-size:1rem;cursor:pointer}
.daynav .dlabel{flex:1;text-align:center}
.daynav .dlabel b{font-family:Georgia,serif;font-size:1.05rem}
.daynav .dlabel small{display:block;color:var(--muted);font-size:.72rem}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:.68rem;font-weight:600;letter-spacing:.04em}
.chip.f1{background:var(--accent-soft);color:var(--accent)}
.chip.f2{background:var(--done-soft);color:var(--done)}
.chip.f3{background:var(--warn-soft);color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--stripe,var(--muted));border-radius:10px;margin:10px 0;padding:10px 12px 10px 14px;transition:opacity .15s}
.card.done{opacity:.55}
.card.done .bt{text-decoration:line-through}
.card .rowa{display:flex;gap:10px;align-items:flex-start}
.ck{appearance:none;width:22px;height:22px;min-width:22px;border:2px solid var(--line);border-radius:6px;cursor:pointer;margin-top:2px;position:relative;background:var(--surface)}
.ck:checked{background:var(--done);border-color:var(--done)}
.ck:checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.85rem;font-weight:700}
.ck:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bt{font-weight:600;font-size:.92rem}
.bmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.tag{font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--stripe,var(--muted))}
.mmin{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mat{font-size:.72rem;color:var(--muted)}
.badge-moved{font-size:.66rem;background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:1px 8px;font-weight:600}
.det{font-size:.84rem;color:var(--ink);margin-top:7px;display:none;border-top:1px dashed var(--line);padding-top:7px;white-space:pre-wrap}
.card.open .det{display:block}
.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.actions button{background:var(--surface2);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:4px 10px;font-size:.75rem;cursor:pointer}
.actions button:hover{border-color:var(--accent)}
.actions .pct{width:74px;background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:4px 8px;font-size:.78rem;font-variant-numeric:tabular-nums}
.dayfoot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.78rem;margin:10px 0 20px;font-variant-numeric:tabular-nums}
.dayfoot button{background:none;border:1px solid var(--line);border-radius:7px;color:var(--muted);padding:4px 10px;font-size:.72rem;cursor:pointer}
.backlog{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:.85rem}
h2.sec{font-family:Georgia,serif;font-size:1.02rem;margin:20px 0 4px}
table{width:100%;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
th,td{border-bottom:1px solid var(--line);text-align:left;padding:6px 8px}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td input{width:64px;background:var(--surface);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:3px 6px;font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.weekgrid .wd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;display:flex;gap:10px;align-items:center;cursor:pointer}
.weekgrid .wd .l{flex:1}
.weekgrid .wd b{font-family:Georgia,serif}
.weekgrid .wd small{color:var(--muted);display:block;font-size:.72rem}
.filterchips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.filterchips button{background:var(--surface);border:1px solid var(--line);border-radius:99px;color:var(--ink);padding:3px 11px;font-size:.74rem;cursor:pointer}
.filterchips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.jitem{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin:7px 0;display:flex;gap:9px;align-items:flex-start;font-size:.84rem}
.jitem .cit{margin-left:auto;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:0 8px;font-size:.7rem;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.jitem.done{opacity:.5}
.searchbox{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:8px 12px;font-size:.88rem}
.toolbar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.toolbar button{background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 12px;font-size:.78rem;cursor:pointer}
.note{color:var(--muted);font-size:.76rem;margin:8px 0}
.matline{display:flex;align-items:center;gap:8px;margin:9px 0}
.matline .nm{width:132px;font-size:.8rem}
.matline .bar{flex:1;margin:0}
.matline .n{width:86px;text-align:right;font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:.88rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:420px;width:100%;padding:22px}
.modal h2{font-family:Georgia,serif;margin:0 0 6px;font-size:1.1rem}
.modal p{font-size:.84rem;color:var(--muted);margin:6px 0 14px}
.modal input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:10px 12px;font-size:.95rem;margin-bottom:12px}
.modal .btns{display:flex;gap:8px;flex-wrap:wrap}
.modal button.primary{background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer}
.modal button.ghost{background:none;border:none;color:var(--muted);font-size:.78rem;cursor:pointer;text-decoration:underline}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const KEY2="enam-cron-v2", KEY1="enam-cron-v1", TKEY="enam-sync-token";
let S={kv:{}};
(function load(){
  try{
    const raw=localStorage.getItem(KEY2);
    if(raw){S=JSON.parse(raw);if(!S.kv)S={kv:{}};return}
    const old=localStorage.getItem(KEY1);
    if(old){const o=JSON.parse(old);const now=Date.now();const kv={};
      for(const id in (o.st||{}))kv["st:"+id]=[o.st[id],now];
      for(const id in (o.pct||{}))kv["pct:"+id]=[o.pct[id],now];
      for(const id in (o.mv||{}))kv["mv:"+id]=[o.mv[id],now];
      for(const i in (o.js||{}))kv["js:"+i]=[1,now];
      for(const d in (o.sim||{}))kv["sim:"+d]=[o.sim[d],now];
      S={kv};saveLocal();}
  }catch(e){S={kv:{}}}
})();
function saveLocal(){try{localStorage.setItem(KEY2,JSON.stringify(S))}catch(e){}}
function G(k){const e=S.kv[k];return e==null?null:e[0]}
function SET(k,v){S.kv[k]=[v,Date.now()];saveLocal();schedulePush();}
function mergeKv(into,from){let ch=false;for(const k in from){const e=from[k];if(!Array.isArray(e)||e.length<2)continue;if(!into[k]||(e[1]||0)>(into[k][1]||0)){into[k]=e;ch=true}}return ch}
// ---------- sincronização ----------
let token=localStorage.getItem(TKEY)||"";
let pushTimer=0,lastSync=null,syncState=token?"sync":"off";
function setSync(s){syncState=s;const p=document.getElementById("syncpill");if(!p)return;p.className=s;
  p.textContent=s==="ok"?("✓ sync "+(lastSync?lastSync.toTimeString().slice(0,5):"")):
  s==="sync"?"sincronizando…":s==="err"?"offline · salvo local":s==="badtoken"?"código inválido!":"sem sincronização"}
function apiCall(method,body){return fetch(API,{method,headers:{"content-type":"application/json","x-sync-token":token},body:body?JSON.stringify(body):undefined})}
async function pull(rerender){if(!token){setSync("off");return}
  setSync("sync");
  try{const r=await apiCall("GET");
    if(r.status===401){setSync("badtoken");return}
    if(!r.ok)throw 0;
    const j=await r.json();
    const ch=mergeKv(S.kv,j.kv||{});
    if(ch){saveLocal();if(rerender!==false)render()}
    lastSync=new Date();setSync("ok");updateStats();
  }catch(e){setSync("err")}}
function schedulePush(){clearTimeout(pushTimer);pushTimer=setTimeout(push,1500)}
async function push(){if(!token){setSync("off");return}
  setSync("sync");
  try{const r=await apiCall("POST",{kv:S.kv});
    if(r.status===401){setSync("badtoken");return}
    if(!r.ok)throw 0;
    const j=await r.json();
    if(mergeKv(S.kv,j.kv||{}))saveLocal();
    lastSync=new Date();setSync("ok");updateStats();
  }catch(e){setSync("err")}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()});

function isDone(b){return G("st:"+b.id)==="done"}
function effDate(b){return G("mv:"+b.id)||b.day}
function fmt(dstr){const p=dstr.split("-");return p[2]+"/"+p[1]}
function wdName(dstr){return["dom","seg","ter","qua","qui","sex","sáb"][new Date(dstr+"T12:00:00").getDay()]}
function todayStr(){const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
let curDate=(()=>{const t=todayStr();if(dayIdx[t]!=null)return t;const f=DATA.days.find(d=>d.d>=t);return f?f.d:DATA.days[DATA.days.length-1].d})();

// intervalos [a,b]: união e cobertura
function unionIv(iv){if(!iv.length)return[];iv=iv.slice().sort((x,y)=>x[0]-y[0]);const out=[[iv[0][0],iv[0][1]]];for(let i=1;i<iv.length;i++){const c=out[out.length-1];if(iv[i][0]<=c[1]+1)c[1]=Math.max(c[1],iv[i][1]);else out.push([iv[i][0],iv[i][1]])}return out}
function unionLen(iv){return unionIv(iv).reduce((a,c)=>a+(c[1]-c[0]+1),0)}
function rangeCovered(iv,a,b){let need=a;for(const seg of unionIv(iv)){if(seg[0]>need)return false;if(seg[1]>=need)need=seg[1]+1;if(need>b)return true}return need>b}
function capsTicked(bk){const iv=[];bk.caps.forEach(c=>{if(G("eb:"+bk.k+":"+c.n))iv.push([c.pi,c.pf])});return iv}
function planIv(k,onlyDone){const iv=[];allBlocks.forEach(b=>{if(b.eb===k&&b.pg&&(!onlyDone||isDone(b)))iv.push(b.pg)});return iv}

function extraLoad(dstr){let m=0;for(const k in S.kv){if(!k.startsWith("mv:"))continue;const v=S.kv[k][0];if(v!==dstr)continue;const id=k.slice(3);if(G("st:"+id)!=="done"){const b=allBlocks.find(x=>x.id===id);if(b)m+=b.min}}return m}
function adiar(b){
  const from=effDate(b);
  if(b.tipo==="SIM"){
    const target=DATA.days.find(d=>d.d>from&&new Date(d.d+"T12:00:00").getDay()===0&&d.d<"2026-10-18"&&!d.blocks.some(x=>x.tipo==="SIM"&&!isDone(x)&&effDate(x)===d.d));
    if(target){SET("mv:"+b.id,target.d);render();toast("Simulado movido para "+wdName(target.d)+" "+fmt(target.d))}
    else toast("Sem domingo livre antes da prova.");
    return;
  }
  const cand=DATA.days.filter(d=>d.d>from&&d.d<"2026-10-17");
  for(const d of cand){if(extraLoad(d.d)+b.min<=50){SET("mv:"+b.id,d.d);render();toast("Bloco realocado para "+wdName(d.d)+" "+fmt(d.d));return}}
  SET("mv:"+b.id,"fila");render();toast("Semanas cheias — bloco na fila (topo da aba Hoje).");
}

function blockCard(b,showOrigin){
  const done=isDone(b);

  div.className="card"+(done?" done":"");
  div.style.setProperty("--stripe","var("+(TIPO_VAR[b.tipo]||"--rev")+")");

  const aw=k=>!!G("au:"+k.c+":"+k.n);
  const watched=b.aulas&&b.aulas.length>0&&b.aulas.every(aw);
  const altWatched=b.alt&&b.alt.length>0&&b.alt.every(aw);
  div.innerHTML='<div class="rowa">'+

    (moved&&showOrigin?'<span class="badge-moved">↻ de '+fmt(b.day)+'</span>':"")+
    (watched&&!done?'<span class="badge-moved" style="background:var(--done-soft);color:var(--done)">✓ aulas já assistidas — conclua o bloco</span>':"")+
    (altWatched&&!done?'<span class="badge-moved" style="background:var(--done-soft);color:var(--done)">▶ vídeo já visto — pule ou vire revisão</span>':"")+
    (b.eb&&b.pg&&!done&&EBK[b.eb]&&rangeCovered(capsTicked(EBK[b.eb]),b.pg[0],b.pg[1])?'<span class="badge-moved" style="background:var(--done-soft);color:var(--done)">📖 trecho já lido</span>':"")+'</div>'+
    '<div class="det">'+esc(b.det||"")+'</div>'+
    '<div class="actions"><button class="exp">detalhes</button>'+
    (done?"":'<button class="adi">não consegui → realocar</button>')+
    (b.tipo==="QUEST"?'<input class="pct" type="number" min="0" max="100" placeholder="% acerto" value="'+(pctVal==null?"":pctVal)+'" aria-label="Percentual de acerto">':"")+
    '</div></div></div>';
  div.querySelector(".ck").addEventListener("change",e=>{
    SET("st:"+b.id,e.target.checked?"done":null);
    if(e.target.checked&&b.aulas)b.aulas.forEach(a=>{if(!G("au:"+a.c+":"+a.n))SET("au:"+a.c+":"+a.n,1)});

  return div;
}

  const day=DATA.days[dayIdx[curDate]];
  const wk=day.wk;
  const nav=document.createElement("div");nav.className="daynav";
  nav.innerHTML='<button id="pv">‹</button><div class="dlabel"><b>Semana '+wk+'</b><small>'+day.fase+'</small></div><button id="nx">›</button>';
  root.appendChild(nav);
  nav.querySelector("#pv").addEventListener("click",()=>{const t=DATA.days.find(d=>d.wk===wk-1);if(t){curDate=t.d;render()}});
  nav.querySelector("#nx").addEventListener("click",()=>{const t=DATA.days.find(d=>d.wk===wk+1);if(t){curDate=t.d;render()}});
  const grid=document.createElement("div");grid.className="weekgrid";
  DATA.days.filter(d=>d.wk===wk).forEach(d=>{
    const blocks=allBlocks.filter(b=>effDate(b)===d.d);
    const dn=blocks.filter(b=>isDone(b)).length;
    const mats=[...new Set(blocks.map(b=>b.mat))].slice(0,4).join(" · ");
    const el=document.createElement("div");el.className="wd";
    el.innerHTML='<div class="l"><b>'+wdName(d.d)+" "+fmt(d.d)+'</b><small>'+esc(mats||"livre")+'</small></div>'+
      '<div style="text-align:right"><span class="mmin">'+dn+"/"+blocks.length+'</span><div class="bar" style="width:70px"><i style="width:'+(blocks.length?Math.round(dn/blocks.length*100):0)+'%"></i></div></div>';
    el.addEventListener("click",()=>{curDate=d.d;curTab="hoje";render()});
    grid.appendChild(el);
  });
  root.appendChild(grid);
}
function vProg(root){
  root.insertAdjacentHTML("beforeend",'<h2 class="sec">Simulados oficiais</h2><div class="note">Registre os acertos ao corrigir. Meta em 80 questões.</div>');
  const tw=document.createElement("div");tw.className="tablewrap";
  const tb=document.createElement("table");
  tb.innerHTML="<tr><th>Data</th><th>Prova</th><th>Meta</th><th>Acertos</th></tr>";
  SIMS.forEach(s=>{
    const d=s[0],nome=s[1],meta=s[2];
    const tr=document.createElement("tr");
    const v=G("sim:"+d);
    tr.innerHTML="<td>"+fmt(d)+"</td><td>"+esc(nome)+"</td><td>"+(meta==="—"?"—":"≥ "+meta)+'</td><td><input type="number" min="0" max="80" value="'+(v==null?"":v)+'"></td>';
    tr.querySelector("input").addEventListener("change",e=>SET("sim:"+d,+e.target.value));
    tb.appendChild(tr);
  });
  tw.appendChild(tb);root.appendChild(tw);
  root.insertAdjacentHTML("beforeend",'<h2 class="sec">Progresso por matéria</h2>');
  const mats={};
  allBlocks.forEach(b=>{if(!mats[b.mat])mats[b.mat]={t:0,d:0,pct:[],min:0};const m=mats[b.mat];m.t++;m.min+=b.min;
    if(isDone(b))m.d++;
    if(b.tipo==="QUEST"){const p=G("pct:"+b.id);if(p!=null)m.pct.push(p)}});
  Object.entries(mats).sort((a,b)=>b[1].min-a[1].min).forEach(en=>{
    const m=en[0],v=en[1];
    const avg=v.pct.length?Math.round(v.pct.reduce((a,c)=>a+c,0)/v.pct.length):null;
    const line=document.createElement("div");line.className="matline";
    line.innerHTML='<div class="nm">'+esc(m)+'</div><div class="bar"><i style="width:'+Math.round(v.d/v.t*100)+'%"></i></div><div class="n">'+v.d+"/"+v.t+(avg!=null?" · "+avg+"%":"")+"</div>";
    root.appendChild(line);
  });
  root.insertAdjacentHTML("beforeend",'<div class="note">A média % vem dos blocos de questões com acerto registrado. Média &lt; 60%: o tópico volta no Ciclo 2 — priorize nas baterias de domingo.</div>');
  root.insertAdjacentHTML("beforeend",'<h2 class="sec">Leitura dos e-books (CPJuris)</h2><div class="note">Lido = blocos de e-book concluídos + capítulos ticados por você. Plano = quanto o cronograma prevê ler. Toque num livro para abrir os capítulos e registrar leitura feita fora do cronograma.</div>');
  (DATA.ebooks||[]).forEach(bk=>{
    const readIv=planIv(bk.k,true).concat(capsTicked(bk));
    const read=unionLen(readIv);
    const plan=unionLen(planIv(bk.k,false));
    const pcRead=Math.round(100*read/bk.total),pcPlan=Math.round(100*plan/bk.total);
    const det=document.createElement("details");
    det.innerHTML='<summary style="cursor:pointer;list-style:none"><div class="matline"><div class="nm">'+esc(bk.nome.replace("Direito ",""))+'</div><div class="bar" style="position:relative"><i style="width:'+pcRead+'%"></i><span style="position:absolute;top:-2px;bottom:-2px;left:'+pcPlan+'%;width:2px;background:var(--warn)"></span></div><div class="n">'+read+"/"+bk.total+"p · plano "+pcPlan+"%</div></div></summary>";
    const inner=document.createElement("div");inner.style.margin="4px 0 12px";
    bk.caps.forEach(c=>{
      const k="eb:"+bk.k+":"+c.n;
      const dn=!!G(k);
      const el=document.createElement("div");el.className="jitem"+(dn?" done":"");
      el.innerHTML='<input type="checkbox" class="ck" '+(dn?"checked":"")+' aria-label="Li este capítulo"><div><b>Cap. '+c.n+"</b> "+esc(c.t)+'</div><span class="cit">p. '+c.pi+"-"+c.pf+"</span>";
      el.querySelector("input").addEventListener("change",e=>{SET(k,e.target.checked?1:null);el.classList.toggle("done",e.target.checked)});
      inner.appendChild(el);
    });
    det.appendChild(inner);
    root.appendChild(det);
  });
}
function vAulas(root){
  const tot=(DATA.cursos||[]).reduce((a,c)=>a+c.aulas.length,0);
  let dn=0;(DATA.cursos||[]).forEach(c=>c.aulas.forEach(a=>{if(G("au:"+c.curso+":"+a.n))dn++}));
  root.insertAdjacentHTML("beforeend",'<div class="note" style="margin-top:12px">Catálogo completo do CPIuris ('+tot+' aulas). Tique o que assistir — em qualquer ordem, dentro ou fora do cronograma. Os blocos do cronograma cujas aulas você já viu ganham selo verde e podem ser concluídos direto. Assistidas: <b>'+dn+"/"+tot+"</b>.</div>");
  const chips=document.createElement("div");chips.className="filterchips";
  const mk=(label,val)=>{const b=document.createElement("button");b.textContent=label;b.className=cursoFilter===val?"on":"";b.addEventListener("click",()=>{cursoFilter=val;render()});return b};
  chips.appendChild(mk("Todos",""));
  (DATA.cursos||[]).forEach(c=>chips.appendChild(mk(c.curso.replace("Noções Constitucionais de Direito ","NC ").replace("Direito ","").slice(0,24),c.curso)));
  root.appendChild(chips);
  (DATA.cursos||[]).filter(c=>!cursoFilter||c.curso===cursoFilter).forEach(c=>{
    let cd=0,cm=0;c.aulas.forEach(a=>{cm+=a.min;if(G("au:"+c.curso+":"+a.n))cd++});
    root.insertAdjacentHTML("beforeend",'<h2 class="sec">'+esc(c.curso)+' <span class="mmin">'+cd+"/"+c.aulas.length+" aulas · "+Math.round(cm/60)+'h</span></h2>'+(c.nota?'<div class="note">'+esc(c.nota)+"</div>":""));
    c.aulas.forEach(a=>{
      const k="au:"+c.curso+":"+a.n;
      const dn2=!!G(k);
      const el=document.createElement("div");el.className="jitem"+(dn2?" done":"");
      el.innerHTML='<input type="checkbox" class="ck" '+(dn2?"checked":"")+' aria-label="Assisti esta aula"><div><b>nº '+a.n+"</b> "+esc(a.nome)+'</div><span class="cit">'+a.min+"min</span>";
      el.querySelector("input").addEventListener("change",e=>{SET(k,e.target.checked?1:null);el.classList.toggle("done",e.target.checked)});
      root.appendChild(el);
    });
  });
}
function vJuris(root){
  root.insertAdjacentHTML("beforeend",'<div class="note" style="margin-top:12px">231 súmulas, temas e julgados extraídos dos seus 12 estudos de banca FGV. Marque o que já domina. Formato: referência → tese.</div>');
  const mats=[...new Set(DATA.juris.map(j=>j.mat))];
  const chips=document.createElement("div");chips.className="filterchips";
  const mk=(label,val)=>{const b=document.createElement("button");b.textContent=label;b.className=jurFilter===val?"on":"";b.addEventListener("click",()=>{jurFilter=val;render()});return b};
  chips.appendChild(mk("Todas",""));mats.forEach(m=>chips.appendChild(mk(m.replace("Direito ",""),m)));
  root.appendChild(chips);
  const sb=document.createElement("input");sb.className="searchbox";sb.placeholder="Buscar (ex.: 466.343, nepotismo, Tema 988...)";sb.value=jurQ;
  sb.addEventListener("input",e=>{jurQ=e.target.value;renderJurisList(list)});
  root.appendChild(sb);
  const list=document.createElement("div");root.appendChild(list);
  renderJurisList(list);
}
function renderJurisList(list){
  list.innerHTML="";
  const q=jurQ.toLowerCase();
  let items=DATA.juris.map((j,i)=>({j,i})).filter(o=>(!jurFilter||o.j.mat===jurFilter)&&(!q||(o.j.ref+" "+o.j.tese).toLowerCase().includes(q)));
  items.sort((a,b)=>b.j.cit-a.j.cit);
  items.slice(0,200).forEach(o=>{
    const j=o.j,i=o.i;
    const dn=!!G("js:"+i);
    const el=document.createElement("div");el.className="jitem"+(dn?" done":"");
    el.innerHTML='<input type="checkbox" class="ck" '+(dn?"checked":"")+' aria-label="Domino esta tese"><div><b>'+esc(j.ref)+'</b> <span class="mat">· '+esc(j.mat)+"</span><br>"+esc(j.tese)+'</div><span class="cit">'+j.cit+"×</span>";
    el.querySelector("input").addEventListener("change",e=>{SET("js:"+i,e.target.checked?1:null);el.classList.toggle("done",e.target.checked)});
    list.appendChild(el);
  });
  if(!items.length)list.innerHTML='<div class="empty">Nada encontrado.</div>';
}
function vAjustes(root){
  const tb=document.createElement("div");tb.className="toolbar";tb.style.marginTop="16px";
  const mkb=(txt,fn)=>{const b=document.createElement("button");b.textContent=txt;b.addEventListener("click",fn);return b};
  tb.appendChild(mkb("Sincronizar agora",()=>{pull().then(()=>push())}));
  tb.appendChild(mkb(token?"Trocar código de sincronização":"Ativar sincronização",()=>showSetup()));
  tb.appendChild(mkb("Exportar backup",()=>{
    const payload=JSON.stringify({v:2,exported:new Date().toISOString(),state:S});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([payload],{type:"application/json"}));
    a.download="enam-progresso.json";document.body.appendChild(a);a.click();a.remove();
  }));
  const imp=document.createElement("input");imp.type="file";imp.accept=".json";imp.style.display="none";
  imp.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const obj=JSON.parse(r.result);
      if(obj.state&&obj.state.kv){mergeKv(S.kv,obj.state.kv);saveLocal();push();render();toast("Backup mesclado.")}
      else if(obj.state){const now=Date.now();const o=obj.state;const kv={};
        for(const id in (o.st||{}))kv["st:"+id]=[o.st[id],now];
        for(const id in (o.pct||{}))kv["pct:"+id]=[o.pct[id],now];
        for(const id in (o.mv||{}))kv["mv:"+id]=[o.mv[id],now];
        for(const i2 in (o.js||{}))kv["js:"+i2]=[1,now];
        for(const d in (o.sim||{}))kv["sim:"+d]=[o.sim[d],now];
        mergeKv(S.kv,kv);saveLocal();push();render();toast("Backup antigo convertido e mesclado.")}
      else toast("Arquivo inválido.")}catch(err){toast("Arquivo inválido.")}};
    r.readAsText(f)});
  tb.appendChild(mkb("Importar backup",()=>imp.click()));tb.appendChild(imp);
  tb.appendChild(mkb("Zerar tudo",()=>{
    if(!confirm("Apagar TODO o progresso (neste aparelho e na nuvem)?"))return;
    const now=Date.now();
    for(const k in S.kv)S.kv[k]=[null,now];
    saveLocal();push();render();
  }));
  root.appendChild(tb);
  const info=document.createElement("div");info.className="note";
  info.innerHTML="Progresso sincronizado automaticamente entre aparelhos via seu Supabase (projeto elucidados-dev, tabela enam_sync). O selo no topo mostra o estado: <b>✓ sync</b> = tudo salvo na nuvem; <b>offline</b> = salvo neste aparelho e reenviado quando a conexão voltar.<br><br>"+
  "<b>Primeiro uso em cada aparelho:</b> abrir o link → colar o código de sincronização → pronto. No celular, use “Adicionar à tela inicial”.<br><br>"+
  "<b>Filtro-base do TEC</b> (montar uma vez): bancas <b>FGV + Cebraspe</b> · área jurídica · <b>2021-2026</b>. Cada bloco de questões indica o(s) assunto(s) a adicionar.<br><br>"+
  "<b>Quando o edital 2026.2 sair:</b> confira a data da prova; se mudar, avise o Claude no chat que ele regenera o app.";
  root.appendChild(info);
}
// ---------- stats + render ----------
function updateStats(){
  const t=todayStr();
  const prova=new Date("2026-10-18T12:00:00"),now=new Date(t+"T12:00:00");
  document.getElementById("stDays").textContent=Math.max(0,Math.round((prova-now)/86400000));
  let done=0,moved=0;
  for(const k in S.kv){const v=S.kv[k][0];
    if(k.startsWith("st:")&&v==="done")done++;
    if(k.startsWith("mv:")&&v!=null){const id=k.slice(3);if(G("st:"+id)!=="done")moved++}}
  document.getElementById("stDone").textContent=done+"/"+allBlocks.length;
  document.getElementById("stPend").textContent=moved;
}
function render(){
  updateStats();
  const root=document.getElementById("view");root.innerHTML="";
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===curTab));
  if(curTab==="hoje")vHoje(root);
  else if(curTab==="semana")vSemana(root);
  else if(curTab==="prog")vProg(root);
  else if(curTab==="juris")vJuris(root);
  else if(curTab==="aulas")vAulas(root);
  else vAjustes(root);
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{curTab=b.dataset.tab;render()}));
render();
setSync(syncState);
if(!token)showSetup();else pull();
</script>
